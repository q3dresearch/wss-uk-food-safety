<svg xmlns="http://www.w3.org/2000/svg" width="940" height="530" viewBox="0 0 940 530">
<rect x="0.0" y="0.0" width="940.0" height="530.0" fill="#fcfcfb" rx="0"/>
<text x="56.0" y="48.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="600">A 1 is a judgement about the operator, not a dirtier kitchen</text>
<text x="56.0" y="74.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Each component as a share of its own maximum, by rating. Higher is worse. FHRS only — Scotland publishes no component scores.</text>
<text x="56.0" y="96.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">Between a 1 and a 2 the Hygiene score barely moves and Structural moves a little. Confidence in Management halves.</text>
<text x="56.0" y="112.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">Scales differ (Hygiene and Structural to 25, Management to 30), so raw scores are not comparable and shares are used.</text>
