<line x1="56.0" y1="446.0" x2="884.0" y2="446.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="56.0" y="472.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Hygiene at a 1 is 10.7 and at a 2 is 10.5. Management is 19.6 and 9.4.</text>
<text x="56.0" y="496.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">THE DECISION: what an enforcement conversation is about. If the kitchen is equally clean at a 1 and a 2, the thing separating them is the inspector's</text>
<text x="56.0" y="514.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">confidence in the operator — which is a different remedy, and a different appeal, from a cleaning order.</text>
