<text x="56.0" y="524.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Every pair above is in London, and that is the method, not a finding about London.</text>
<text x="56.0" y="548.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">150 m only finds neighbours across a boundary where shops are dense, so the design currently reaches inner-city borders and almost nowhere else.</text>
<text x="56.0" y="570.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">NOT CONTROLLED FOR: business-type mix. If one side is takeaways and the other supermarkets, that alone moves the mean.</text>
<text x="56.0" y="588.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Matching on BusinessType is the next refinement; until then these gaps are suggestive, not attributable. See D1.</text>
