<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470">
<rect x="0.0" y="0.0" width="940.0" height="470.0" fill="#fcfcfb" rx="0"/>
<text x="56.0" y="48.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="600">The cohort is big enough to answer the questions</text>
<text x="56.0" y="74.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Each question against the number of establishments actually in that state today, and the precision that buys after one year of capture.</text>
<text x="56.0" y="96.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">The sibling repository wss-sponsor-licences watches 68 entities, so every group comparison there needs ~163 per arm and is five years away.</text>
<text x="56.0" y="112.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">This is the same arithmetic run BEFORE building rather than after.</text>
<text x="56.0" y="180.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">What share of 0–2 rated shops recover within a year?</text>
<text x="56.0" y="198.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">cohort today: 18,249   ±1% needs 7,203</text>
<rect x="620.0" y="168.0" width="190.0" height="17.0" fill="#e1e0d9" rx="4"/>
<rect x="620.0" y="168.0" width="75.0" height="17.0" fill="#2a78d6" rx="4"/>
<text x="820.0" y="181.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600">reachable</text>
<text x="56.0" y="232.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">The same, split by business type</text>
<text x="56.0" y="250.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">cohort today: 2,281   ±2% needs 1,801</text>
<rect x="620.0" y="220.0" width="190.0" height="17.0" fill="#e1e0d9" rx="4"/>
<rect x="620.0" y="220.0" width="150.0" height="17.0" fill="#2a78d6" rx="4"/>
<text x="820.0" y="233.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600">reachable</text>
<text x="56.0" y="284.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">How long do new registrations wait for a first inspection?</text>
<text x="56.0" y="302.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">cohort today: 52,764   ±1% needs 7,203</text>
<rect x="620.0" y="272.0" width="190.0" height="17.0" fill="#e1e0d9" rx="4"/>
<rect x="620.0" y="272.0" width="25.9" height="17.0" fill="#2a78d6" rx="4"/>
<text x="820.0" y="285.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600">reachable</text>
<text x="56.0" y="336.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Do chains recover faster than independents?</text>
<text x="56.0" y="354.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="start" font-weight="normal">cohort today: 9,124   ±2% needs 1,801</text>
<rect x="620.0" y="324.0" width="190.0" height="17.0" fill="#e1e0d9" rx="4"/>
<rect x="620.0" y="324.0" width="37.5" height="17.0" fill="#2a78d6" rx="4"/>
<text x="820.0" y="337.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600">reachable</text>
<line x1="56.0" y1="404.0" x2="884.0" y2="404.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="56.0" y="432.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Every question above clears its own sample size on the first capture. What they need is time, not a bigger register.</text>
<text x="56.0" y="456.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Bars show the share of the cohort the question consumes — shorter is more headroom. The binding constraint here is the twelve months of capture, nothing else.</text>
</svg>
