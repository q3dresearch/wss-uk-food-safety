gates:
  expect_status: 200
  # River Tees publishes 3 establishments. A floor can only be set for the
  # smallest file in the set; everything else leans on must_contain and on
  # max_shrink_pct, which is evaluated per endpoint.
  min_bytes: 600
  content_type_any: [xml]
  # ReturnCode is the publisher's own verdict on the extract. Gating on the
  # STRUCTURE (a well-formed envelope) would pass a file that says it failed,
  # which is the shape of every bad capture this fleet has had.
  must_contain: ["<ReturnCode>Success</ReturnCode>", "<EstablishmentDetail>"]
  max_shrink_pct: 25
