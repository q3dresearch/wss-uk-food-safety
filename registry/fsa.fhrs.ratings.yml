# Every food hygiene rating in the UK, and the one that was there before it.
#
# 613,146 ESTABLISHMENTS ACROSS 363 LOCAL AUTHORITIES, and the publisher keeps
# no history of any of them. The record carries RatingValue and RatingDate --
# what the rating is now and when it was set -- and nothing else. There is no
# history, previous, prior or former field in the API, and web.archive.org holds
# ZERO captures of these bulk files. So an establishment that went 5 to 1 to 5
# is indistinguishable from one that has always been 5, and the 1 is gone.
#
# WHY THIS ONE AND NOT ANOTHER REGISTER. It was screened cohort-first: in one
# sampled authority 36.9% of establishments were re-rated within twelve months
# and the median rating is 1.4 years old, which scales to roughly 226,000 rating
# events a year. The sibling repo wss-sponsor-licences watches 68 entities and
# can therefore only ever produce one number; this watches ~613,000 and can
# support real comparisons -- including across 363 authorities, which is a
# control set rather than an anecdote.
#
# IDENTITY IS PUBLISHER-MINTED. FHRSID is a stable id, so none of the
# name-and-town hashing the UK sponsor registers force, and a rename is not
# mistaken for a departure.
#
# TWO SCHEMES, NEVER MERGE THEM. 331 authorities run FHRS and score 0-5 with
# Hygiene, Structural and ConfidenceInManagement components. 32 Scottish
# authorities run FHIS, whose vocabulary is Pass / Improvement Required / Pass
# and Eat Safe / Awaiting Inspection, with NO component scores at all. A mean
# rating computed across both is meaningless and the parser refuses to make one.
#
# EN-GB ONLY, DELIBERATELY. Welsh authorities also publish a cy-GB file. It is a
# TRANSLATION of the same establishments, not additional ones, and capturing
# both would silently double-count Wales.
#
# ADDRESSES ARE CAPTURED AND NOT PUBLISHED. AddressLine1/3/4 and PostCode are
# present on roughly 80% of records and a home-based caterer's business address
# is their home address. Captured verbatim because capture is the irreversible
# step; the derived table keys on FHRSID and carries only the postcode district.
source_id: fsa.fhrs.ratings
status: active
cadence: monthly
schema_id: fsa-fhrs.v1

publisher: Food Standards Agency
publisher_tier: first_party
destroys_own_history: true
licence: "Open Government Licence v3.0 — https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
personal_data: parties_only
storage: object
# An unchanged authority still says "these 464 establishments still hold these
# ratings on this date", which is the presence observation this archive is for.
restate: every_capture
# SIZE, NOT LICENCE. The Open Government Licence permits publishing every row;
# ~613,000 establishments at six observations each is roughly 4 million rows a
# capture, which is not a thing to put in git every month. The per-establishment
# series goes to object storage and git keeps the authority-level aggregates,
# which are what every question except "did THIS shop recover" is asked at.
publish: aggregates
aggregate_prefixes: ["authority:"]

notes: >-
  One XML per local authority, 363 of them, ~900 bytes per establishment for
  roughly 550 MB a full capture. Each file carries its own Header with
  ExtractDate, ItemCount and ReturnCode, so the parser can check the count it
  parsed against the count the publisher declared rather than trusting its own
  loop. Smallest authority is River Tees with 3 establishments and largest is
  Birmingham with 10,221, so min_bytes can only be a floor for the smallest --
  truncation of a large file is caught by max_shrink_pct, which the engine
  applies per endpoint against that endpoint's own previous capture.

