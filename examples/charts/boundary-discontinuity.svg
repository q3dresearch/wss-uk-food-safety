<text x="577.6" y="322.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#2a78d6" text-anchor="start" font-weight="600">Brent 4.55</text>
<text x="489.3" y="305.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">0.53 stars apart</text>
<text x="286.0" y="338.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="end" font-weight="normal">n=81 vs 97</text>
<line x1="498.6" y1="372.0" x2="631.4" y2="372.0" stroke="#c3c2b7" stroke-width="3"/>
