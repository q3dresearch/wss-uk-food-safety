<circle cx="645.3" cy="426.0" r="7.0" fill="#2a78d6" fill-opacity="1.0"/>
<text x="550.5" y="430.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#eb6834" text-anchor="end" font-weight="600">Westminster 4.55</text>
<text x="659.3" y="430.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#2a78d6" text-anchor="start" font-weight="600">Kensington and Chelsea 4.84</text>
<text x="604.9" y="413.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">0.29 stars apart</text>
<text x="286.0" y="446.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="end" font-weight="normal">n=111 vs 131</text>
<line x1="56.0" y1="532.0" x2="884.0" y2="532.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="56.0" y="560.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">THE DECISION: a 4 in one borough is not a 4 in the next, and the FSA calls this a national scheme.</text>
<text x="56.0" y="584.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">This is the calibration check nobody publishes. It names which authority pairs to send a joint inspection exercise to, and the component scores say what to</text>
<text x="56.0" y="602.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">calibrate on. Every pair here is in London because 150 m only finds cross-boundary neighbours where shops are dense.</text>
<text x="56.0" y="626.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">NOT CONTROLLED FOR: business-type mix. Matching on BusinessType is the next refinement; until then these gaps are suggestive.</text>
</svg>
