<svg xmlns="http://www.w3.org/2000/svg" width="940" height="676" viewBox="0 0 940 676">
<rect x="0.0" y="0.0" width="940.0" height="676.0" fill="#fcfcfb" rx="0"/>
<text x="56.0" y="48.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="600">The same street, rated half a star apart</text>
<text x="56.0" y="74.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Mean hygiene rating of shops within 150 m of a council boundary, compared with the shops just across it.</text>
<text x="56.0" y="96.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">Two premises 150 m apart share a high street, a customer base and a building stock. What differs is which council inspects them.</text>
<text x="56.0" y="112.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">Only pairs whose 95% interval excludes zero are shown; 19 pairs qualified for the test and 5 cleared it.</text>
<line x1="300.0" y1="190.0" x2="300.0" y2="458.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="300.0" y="476.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="middle" font-weight="normal">3.6</text>
<line x1="411.4" y1="190.0" x2="411.4" y2="458.0" stroke="#e1e0d9" stroke-width="1"/>
