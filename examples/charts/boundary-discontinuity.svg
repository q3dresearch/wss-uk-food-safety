<text x="635.8" y="268.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#2a78d6" text-anchor="start" font-weight="600">Haringey 4.76</text>
<text x="542.5" y="251.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">0.57 stars apart</text>
<text x="286.0" y="284.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="9.5" fill="#898781" text-anchor="end" font-weight="normal">n=113 vs 49</text>
<line x1="414.9" y1="318.0" x2="563.6" y2="318.0" stroke="#c3c2b7" stroke-width="3"/>
<circle cx="414.9" cy="318.0" r="7.0" fill="#eb6834" fill-opacity="1.0"/>
<circle cx="563.6" cy="318.0" r="7.0" fill="#2a78d6" fill-opacity="1.0"/>
