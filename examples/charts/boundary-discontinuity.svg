<line x1="522.9" y1="190.0" x2="522.9" y2="458.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="522.9" y="476.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="middle" font-weight="normal">4.4</text>
<line x1="634.3" y1="190.0" x2="634.3" y2="458.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="634.3" y="476.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10.5" fill="#898781" text-anchor="middle" font-weight="normal">4.8</text>
<text x="495.0" y="496.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" fill="#898781" text-anchor="middle" font-weight="normal">mean rating of the shops beside that boundary</text>
<line x1="394.0" y1="210.0" x2="561.4" y2="210.0" stroke="#c3c2b7" stroke-width="3"/>
<circle cx="394.0" cy="210.0" r="7.0" fill="#eb6834" fill-opacity="1.0"/>
<circle cx="561.4" cy="210.0" r="7.0" fill="#2a78d6" fill-opacity="1.0"/>
