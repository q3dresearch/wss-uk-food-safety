<text x="56.0" y="48.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="600">The gap is widest in the building, not the judgement</text>
<text x="56.0" y="74.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">The same boundary pairs, with the rating difference split into its three component scores. Higher is worse.</text>
<text x="56.0" y="96.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">Built to test whether councils disagree most on the DISCRETIONARY component. They do not: Structural is the largest gap in four of five pairs.</text>
<text x="56.0" y="112.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">Structural is the premises' physical fabric, which is the one thing 150 m of distance does not guarantee is alike.</text>
