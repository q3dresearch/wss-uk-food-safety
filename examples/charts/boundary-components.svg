<text x="56.0" y="670.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">So the boundary gap is probably the buildings, not the inspectors.</text>
<text x="56.0" y="694.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">This chart was built expecting the opposite. Structural is the component least under an inspector's discretion and most determined by what was built</text>
<text x="56.0" y="712.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">there — and it carries the widest gap. Matching on premises age and business type is what would settle it; until then no calibration claim is safe.</text>
