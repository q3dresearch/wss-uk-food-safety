<svg xmlns="http://www.w3.org/2000/svg" width="940" height="516" viewBox="0 0 940 516">
<rect x="0.0" y="0.0" width="940.0" height="516.0" fill="#fcfcfb" rx="0"/>
<text x="56.0" y="48.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="20" fill="#0b0b0b" text-anchor="start" font-weight="600">One in six window stickers is three years old or more</text>
<text x="56.0" y="74.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">Age of the rating currently displayed, across 542,983 rated establishments. The sticker carries no date.</text>
<text x="56.0" y="96.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">A 5 awarded last month and a 5 awarded in 2019 are the same green sticker in the window, and the customer cannot tell them apart.</text>
<text x="56.0" y="112.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="start" font-weight="normal">Computed from RatingDate, which every record carries — one capture, no waiting.</text>
<text x="284.0" y="189.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="normal">under 1 year</text>
<rect x="300.0" y="176.0" width="201.2" height="17.0" fill="#2a78d6" rx="4"/>
<text x="511.2" y="189.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">232,453  ·  42.8%</text>
<text x="284.0" y="229.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="normal">1-2 years</text>
<rect x="300.0" y="216.0" width="141.5" height="17.0" fill="#9ec5f4" rx="4"/>
<text x="451.5" y="229.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">163,510  ·  30.1%</text>
<text x="284.0" y="269.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="normal">2-3 years</text>
<rect x="300.0" y="256.0" width="48.2" height="17.0" fill="#b8b6ad" rx="4"/>
<text x="358.2" y="269.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">55,723  ·  10.3%</text>
<text x="284.0" y="309.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">3-5 years</text>
<rect x="300.0" y="296.0" width="35.0" height="17.0" fill="#eb6834" rx="4"/>
<text x="345.0" y="309.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">40,468  ·  7.5%</text>
<text x="284.0" y="349.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12.5" fill="#0b0b0b" text-anchor="end" font-weight="600">over 5 years</text>
<rect x="300.0" y="336.0" width="44.0" height="17.0" fill="#eb6834" rx="4"/>
<text x="354.0" y="349.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">50,829  ·  9.4%</text>
<line x1="56.0" y1="394.0" x2="884.0" y2="394.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="56.0" y="422.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">91,297 establishments (16.8%) display a rating awarded three or more years ago.</text>
<text x="56.0" y="446.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">50,829 of them (9.4%) are showing one earned more than five years ago.</text>
<text x="56.0" y="468.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">THE DECISION: whether the displayed rating should carry its date. That is an FSA scheme choice, and this is the number it turns on.</text>
</svg>
